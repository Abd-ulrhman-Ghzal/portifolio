<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المتجر الإلكتروني — صفحة 3</title>
  <meta name="description" content="متجر منتجات وهمي مع سلة تسوق تفاعلية" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    /* Cart badge sticky */
    .cart-sticky {
      position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 1000;
      background: var(--primary); color: #fff;
      border-radius: 50px; padding: 0.65rem 1.3rem;
      box-shadow: 0 8px 24px rgba(37,99,235,0.35);
      font-weight: 700; font-size: 0.95rem; cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex; align-items: center; gap: 0.5rem;
      border: none;
    }
    .cart-sticky:hover { background: var(--primary-dark); transform: scale(1.05); }
    .cart-count {
      background: #fbbf24; color: #000;
      border-radius: 50%; width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 900;
    }

    /* Product card */
    .product-card {
      background: var(--card-bg); border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid var(--border);
      overflow: hidden; height: 100%; display: flex; flex-direction: column;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 14px 36px rgba(37,99,235,0.14); }
    .product-img {
      height: 150px; display: flex; align-items: center; justify-content: center;
      font-size: 4rem; position: relative;
    }
    .product-badge {
      position: absolute; top: 0.6rem; right: 0.6rem;
      background: var(--danger); color: #fff; border-radius: 50px;
      padding: 0.15rem 0.6rem; font-size: 0.74rem; font-weight: 700;
    }
    .product-body { padding: 1.1rem; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-weight: 900; font-size: 1rem; margin-bottom: 0.3rem; }
    .product-desc { font-size: 0.82rem; color: var(--text-muted); flex: 1; margin-bottom: 0.8rem; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .product-price { font-size: 1.1rem; font-weight: 900; color: var(--primary); }
    .product-price .old { font-size: 0.8rem; color: var(--text-muted); text-decoration: line-through; margin-right: 0.3rem; }
    .add-btn {
      background: var(--primary); color: #fff;
      border: none; border-radius: 8px; padding: 0.45rem 0.9rem;
      font-family: 'Cairo',sans-serif; font-weight: 700; font-size: 0.84rem;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .add-btn:hover { background: var(--primary-dark); }
    .add-btn:active { transform: scale(0.95); }
    .add-btn.added { background: var(--success); }

    /* Filters */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; }
    .filter-btn {
      background: var(--card-bg); border: 1.5px solid var(--border);
      color: var(--text-muted); border-radius: 50px; padding: 0.4rem 1.1rem;
      font-family: 'Cairo',sans-serif; font-weight: 700; font-size: 0.87rem;
      cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* Sort bar */
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .sort-select {
      background: var(--card-bg); border: 1.5px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 0.4rem 0.8rem;
      font-family: 'Cairo',sans-serif; font-size: 0.88rem; cursor: pointer; outline: none;
    }

    /* Cart modal */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 2000; display: none; align-items: flex-end;
    }
    .cart-overlay.open { display: flex; }
    .cart-panel {
      background: var(--card-bg); width: 100%; border-radius: 20px 20px 0 0;
      padding: 1.8rem 1.5rem; max-height: 70vh; overflow-y: auto;
    }
    .cart-panel h3 { font-weight: 900; margin-bottom: 1.2rem; }
    .cart-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
    .cart-item-emoji { font-size: 1.8rem; }
    .cart-item-info { flex: 1; }
    .cart-item-info strong { display: block; font-size: 0.9rem; }
    .cart-item-info small { color: var(--text-muted); font-size: 0.8rem; }
    .cart-item-remove { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; padding: 0 0.3rem; }
    .cart-total { font-size: 1.1rem; font-weight: 900; margin-top: 1.2rem; }
    .cart-total span { color: var(--primary); }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg main-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">⚡ FrontEnd Project</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="page1-portfolio.html">البورتفوليو</a></li>
        <li class="nav-item"><a class="nav-link" href="page2-blog.html">المدونة</a></li>
        <li class="nav-item"><a class="nav-link active" href="page3-store.html">المتجر</a></li>
        <li class="nav-item"><a class="nav-link" href="page4-calculator.html">الحاسبة</a></li>
        <li class="nav-item"><a class="nav-link" href="page5-form.html">التسجيل</a></li>
      </ul>
      <button class="dark-toggle" id="darkToggle">🌙 وضع داكن</button>
    </div>
  </div>
</nav>

<!-- Hero -->
<header class="page-hero" style="background: linear-gradient(135deg, #0f172a 0%, #065f46 100%)">
  <div class="container">
    <h1>🛍️ المتجر الإلكتروني</h1>
    <p>تشكيلة واسعة من المنتجات التقنية بأفضل الأسعار</p>
  </div>
</header>

<main class="section-gap">
  <div class="container">

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all">🌐 الكل</button>
      <button class="filter-btn" data-cat="laptop">💻 لابتوب</button>
      <button class="filter-btn" data-cat="phone">📱 هاتف</button>
      <button class="filter-btn" data-cat="audio">🎧 صوتيات</button>
      <button class="filter-btn" data-cat="accessory">🖱️ إكسسوار</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <p style="color:var(--text-muted); font-size:0.88rem; margin:0">يُعرض <strong id="prodCount">0</strong> منتج</p>
      <select class="sort-select" id="sortSelect">
        <option value="default">الترتيب: افتراضي</option>
        <option value="low">السعر: الأقل أولاً</option>
        <option value="high">السعر: الأعلى أولاً</option>
      </select>
    </div>

    <!-- Products grid -->
    <div class="row g-4" id="productsGrid"></div>
  </div>
</main>

<!-- Cart sticky button -->
<button class="cart-sticky" id="cartBtn" onclick="toggleCart()">
  🛒 السلة <span class="cart-count" id="cartCount">0</span>
</button>

<!-- Cart overlay -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCartOutside(event)">
  <div class="cart-panel">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h3 class="mb-0">🛒 سلة التسوق</h3>
      <button onclick="toggleCart()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text);">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total" id="cartTotal"></div>
    <button class="btn-primary-custom w-100 mt-3" onclick="checkout()">إتمام الطلب ✓</button>
  </div>
</div>

<footer class="main-footer mt-auto">
  <div class="container">
    <p>صفحة 3 — المتجر الإلكتروني &nbsp;|&nbsp; <a href="index.html">← العودة للرئيسية</a></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/shared.js"></script>
<script>
initDarkMode();

const products = [
  { id:1, cat:'laptop', emoji:'💻', bg:'#dbeafe', name:'لابتوب ProBook 15', desc:'معالج i7 الجيل الثالث عشر، 16GB RAM، SSD 512GB', price:3499, old:3999 },
  { id:2, cat:'phone', emoji:'📱', bg:'#fce7f3', name:'هاتف Galaxy Ultra', desc:'شاشة AMOLED 6.8 بوصة، كاميرا 200MP', price:2899, old:3299 },
  { id:3, cat:'audio', emoji:'🎧', bg:'#fef3c7', name:'سماعة StudioPro Max', desc:'إلغاء الضوضاء النشط، بطارية 30 ساعة', price:649, old:799, badge:'-19%' },
  { id:4, cat:'accessory', emoji:'🖱️', bg:'#dcfce7', name:'ماوس ErgoFlow', desc:'لاسلكي، 4000 DPI قابل للضبط', price:199, old:249 },
  { id:5, cat:'laptop', emoji:'🖥️', bg:'#ede9fe', name:'MacBook Air M3', desc:'شيب M3، 8GB Unified Memory، شاشة Retina', price:4999, old:null, badge:'جديد' },
  { id:6, cat:'audio', emoji:'🎵', bg:'#f0fdf4', name:'سماعات EarBuds Pro', desc:'ضوضاء نشطة، مقاومة للماء IPX5', price:349, old:449, badge:'-22%' },
  { id:7, cat:'phone', emoji:'📲', bg:'#fff7ed', name:'iPhone 15 Plus', desc:'شاشة Super Retina 6.7"، A16 Bionic', price:3999, old:null },
  { id:8, cat:'accessory', emoji:'⌨️', bg:'#fdf4ff', name:'كيبورد مكانيكي RGB', desc:'مفاتيح Cherry MX، إضاءة RGB كاملة', price:449, old:549 },
];

let cart = [];
let currentCat = 'all';
let currentSort = 'default';

function getFiltered() {
  let list = currentCat === 'all' ? [...products] : products.filter(p => p.cat === currentCat);
  if (currentSort === 'low') list.sort((a,b) => a.price - b.price);
  if (currentSort === 'high') list.sort((a,b) => b.price - a.price);
  return list;
}

function renderProducts() {
  const list = getFiltered();
  document.getElementById('prodCount').textContent = list.length;
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = list.map(p => `
    <div class="col-sm-6 col-lg-3">
      <div class="product-card">
        <div class="product-img" style="background:${p.bg}">
          ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
          ${p.emoji}
        </div>
        <div class="product-body">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.desc}</div>
          <div class="product-footer">
            <div class="product-price">
              ${p.old ? `<span class="old">${p.old} ر.س</span>` : ''}
              ${p.price} ر.س
            </div>
            <button class="add-btn" id="addBtn-${p.id}" onclick="addToCart(${p.id})">+ السلة</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  const existing = cart.find(x => x.id === id);
  if (existing) existing.qty++;
  else cart.push({ ...p, qty: 1 });

  const btn = document.getElementById(`addBtn-${id}`);
  if (btn) { btn.textContent = '✓ أُضيف'; btn.classList.add('added'); setTimeout(() => { btn.textContent = '+ السلة'; btn.classList.remove('added'); }, 1500); }

  updateCartBadge();
  showToast(`🛒 تمت إضافة ${p.name} إلى السلة`);
}

function updateCartBadge() {
  const total = cart.reduce((s,i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = total;
}

function renderCart() {
  const el = document.getElementById('cartItems');
  const tot = document.getElementById('cartTotal');
  if (cart.length === 0) {
    el.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:1.5rem 0">السلة فارغة 🛒</p>';
    tot.innerHTML = '';
    return;
  }
  el.innerHTML = cart.map(i => `
    <div class="cart-item">
      <span class="cart-item-emoji">${i.emoji}</span>
      <div class="cart-item-info">
        <strong>${i.name}</strong>
        <small>${i.price} ر.س × ${i.qty} = ${i.price * i.qty} ر.س</small>
      </div>
      <button class="cart-item-remove" onclick="removeFromCart(${i.id})">✕</button>
    </div>`).join('');
  const sum = cart.reduce((s,i) => s + i.price * i.qty, 0);
  tot.innerHTML = `إجمالي السلة: <span>${sum} ر.س</span>`;
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  updateCartBadge();
  renderCart();
}

function toggleCart() {
  const overlay = document.getElementById('cartOverlay');
  const isOpen = overlay.classList.contains('open');
  if (!isOpen) { renderCart(); overlay.classList.add('open'); }
  else overlay.classList.remove('open');
}
function closeCartOutside(e) { if (e.target === document.getElementById('cartOverlay')) toggleCart(); }

function checkout() {
  if (cart.length === 0) { showToast('⚠️ السلة فارغة!'); return; }
  cart = []; updateCartBadge();
  document.getElementById('cartOverlay').classList.remove('open');
  showToast('🎉 تم تقديم طلبك بنجاح! شكراً لتسوقك معنا');
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    renderProducts();
  });
});

document.getElementById('sortSelect').addEventListener('change', function() {
  currentSort = this.value;
  renderProducts();
});

renderProducts();
</script>
</body>
</html>
